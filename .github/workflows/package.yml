on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      suffix:
        required: true
        type: string

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      ARCHIVE_NAME: redscript-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-${{ inputs.suffix }}.zip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      - run: cargo build --release --locked -p redscript-cli -p scc -p scc-lib

      - if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package.ps1 -archiveName "$env:ARCHIVE_NAME"
      - if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/package.sh "$ARCHIVE_NAME"

      - name: Verify packaged outputs
        id: outputs
        shell: bash
        env:
          ARTIFACT_SUFFIX: ${{ inputs.suffix }}
        run: |
          case "$ARTIFACT_SUFFIX" in
            windows) cli="redscript-cli.exe" ;;
            macos) cli="redscript-cli-aarch64-darwin" ;;
            linux) cli="redscript-cli-x86_64-linux-gnu" ;;
            *)
              echo "Unsupported artifact suffix: $ARTIFACT_SUFFIX" >&2
              exit 1
              ;;
          esac
          for path in "$cli" "$ARCHIVE_NAME"; do
            if [[ ! -f "$path" || ! -s "$path" ]]; then
              echo "Missing or empty packaged output: $path" >&2
              exit 1
            fi
          done
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        name: Upload artifacts
        with:
          path: |
            ${{ steps.outputs.outputs.cli }}
            ${{ env.ARCHIVE_NAME }}
          name: artifact-${{ inputs.os }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
