name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: default
            features: ""
          - configuration: release
            features: --features mmap,popup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-${{ matrix.configuration }}
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked ${{ matrix.features }}

  rustfmt:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-10-15
          components: rustfmt
      - run: cargo fmt --all --check -- --color always

  test:
    name: Test (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: default
            features: ""
          - configuration: release
            features: --features mmap,popup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-${{ matrix.configuration }}
          cache-on-failure: true
      # FFI tests dynamically load the library produced by cargo build.
      - run: cargo build --workspace --locked ${{ matrix.features }}
      - run: cargo test --workspace --locked ${{ matrix.features }}

  test-macos:
    name: Test portable crates (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p redscript -p redscript-compiler -p redscript-decompiler
