name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    name: Lint, test, and doc
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
      # Verify standalone compilation for feature-bearing crates without workspace feature unification.
      - run: cargo check --no-default-features -p redscript-community-ast -p redscript-io -p redscript-compiler-api -p scc-core --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --bins --lib --tests --locked
      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked

  rustfmt:
    name: Check formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-10-15 --profile minimal --component rustfmt
      - run: cargo +nightly-2026-10-15 fmt --all -- --check

  test-macos:
    name: Test portable crates (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
      - run: cargo test --workspace --bins --lib --tests --locked
