name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lint:
    name: Lint (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: default
            features: ""
          - configuration: release
            features: --features mmap,popup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.configuration }}
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: cargo clippy --workspace --all-targets --locked ${{ matrix.features }}

  rustfmt:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-10-15
          components: rustfmt
      - run: cargo fmt --all --check -- --color always

  test:
    name: Test (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: default
            features: ""
          - configuration: release
            features: --features mmap,popup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.configuration }}
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # FFI tests dynamically load the library produced by cargo build.
      - run: cargo build --locked -p scc -p scc-lib ${{ matrix.features }}
      - run: cargo test --workspace --locked ${{ matrix.features }}

  test-macos:
    name: Test portable crates (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: cargo test --locked -p redscript -p redscript-compiler -p redscript-decompiler
