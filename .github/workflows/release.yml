name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  package:
    name: Build and package
    uses: ./.github/workflows/package.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows
          - os: macos-14
            suffix: macos
    with:
      os: ${{ matrix.os }}
      suffix: ${{ matrix.suffix }}

  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [check, package]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          FLAGS=(--generate-notes --verify-tag)
          ARTIFACTS=(
            "./artifacts/redscript-cli.exe"
            "./artifacts/redscript-cli-aarch64-darwin"
            "./artifacts/redscript-$RELEASE_TAG-windows.zip"
            "./artifacts/redscript-$RELEASE_TAG-macos.zip"
          )
          for artifact in "${ARTIFACTS[@]}"; do
            if [[ ! -f "$artifact" || ! -s "$artifact" ]]; then
              echo "Missing or empty release artifact: $artifact" >&2
              exit 1
            fi
          done

          if [[ "$RELEASE_TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "${FLAGS[@]}" "${ARTIFACTS[@]}"
