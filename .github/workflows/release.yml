name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    name: Build and upload a release artifact for ${{ matrix.os }}
    uses: ./.github/workflows/build.yml
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-14
        include:
          - os: windows-latest
            suffix: windows
          - os: macos-14
            suffix: macos
    with:
      os: ${{ matrix.os }}
      suffix: ${{ matrix.suffix }}

  publish:
    name: Release artifacts
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          FLAGS=(--generate-notes --verify-tag)
          shopt -s nullglob
          ARTIFACTS=(./artifacts/*)
          if (( ${#ARTIFACTS[@]} == 0 )); then
            echo 'No release artifacts found' >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "${FLAGS[@]}" "${ARTIFACTS[@]}"
