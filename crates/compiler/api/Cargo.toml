[package]
name = "redscript-compiler-api"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
redscript-community-ast.workspace = true
redscript-community-parser.workspace = true
redscript-io = { workspace = true, features = ["mmap"] }
redscript-compiler-frontend.workspace = true
redscript-compiler-backend.workspace = true

log.workspace = true
thiserror.workspace = true
bon.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true

[features]
ignore = ["redscript-community-ast/ignore"]
# Thread-safe analysis types (`Send + Sync`) instead of `Rc`/`RefCell`.
sync = ["redscript-compiler-frontend/sync", "redscript-compiler-backend/sync"]
# Thread-safe analysis types plus parallel parsing, lowering and validation.
parallel = ["sync", "redscript-compiler-frontend/parallel", "redscript-compiler-backend/parallel"]
