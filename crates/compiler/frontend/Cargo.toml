[package]
name = "redscript-compiler-frontend"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
redscript-community-ast.workspace = true
redscript-community-parser.workspace = true

thiserror.workspace = true
derive-where.workspace = true
paste.workspace = true
bon.workspace = true
bitfield-struct.workspace = true
identity-hash.workspace = true
slab.workspace = true
smallvec.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
elsa.workspace = true
sequence_trie.workspace = true
rayon = { workspace = true, optional = true }

[dev-dependencies]
redscript-compiler-api.workspace = true

insta.workspace = true

[features]
# Thread-safe analysis types (`Send + Sync`) instead of `Rc`/`RefCell`.
sync = ["redscript-community-ast/sync"]
# Thread-safe analysis types plus parallel parsing, lowering and validation.
parallel = ["sync", "dep:rayon", "redscript-community-parser/parallel"]

[lints]
workspace = true
