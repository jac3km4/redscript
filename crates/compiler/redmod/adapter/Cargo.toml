[package]
name = "redscript-redmod-adapter"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
redscript-community-ast.workspace = true
redscript-redmod-ast.workspace = true
redscript-compiler-frontend.workspace = true
redscript-redmod-parser.workspace = true

[dev-dependencies]
redscript-test-support.workspace = true
insta.workspace = true
redscript-compiler-api.workspace = true
redscript-compiler-backend.workspace = true
redscript-io.workspace = true
redscript-community-parser.workspace = true

[features]
# Thread-safe analysis types (`Send + Sync`) instead of `Rc`/`RefCell`.
sync = ["redscript-compiler-frontend/sync"]
# Thread-safe analysis types plus parallel parsing, lowering and validation.
parallel = ["sync", "redscript-compiler-frontend/parallel"]

[lints]
workspace = true
